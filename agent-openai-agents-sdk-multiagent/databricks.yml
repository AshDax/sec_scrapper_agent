bundle:
  name: agent_openai_agents_sdk_multiagent

resources:
  apps:
    agent_openai_agents_sdk_multiagent:
      name: "agent-sec-extraction"
      description: "SEC Filing Information Extraction Agent — extracts structured business attributes from SEC filings"
      source_code_path: ./
      config:
        command: ["uv", "run", "start-app"]
        env:
          - name: MLFLOW_TRACKING_URI
            value: "databricks"
          - name: MLFLOW_REGISTRY_URI
            value: "databricks-uc"
          - name: API_PROXY
            value: "http://localhost:8000/invocations"
          - name: CHAT_APP_PORT
            value: "3000"
          - name: CHAT_PROXY_TIMEOUT_SECONDS
            value: "300"
          - name: MLFLOW_EXPERIMENT_ID
            value_from: "experiment"

      resources:
        - name: 'experiment'
          experiment:
            experiment_id: "2932940041946641"
            permission: 'CAN_MANAGE'

        # Vector Search index for SEC filing RAG
        - name: 'sec_vector_index'
          uc_securable:
            securable_full_name: 'hackathon_521302447211702.default.embedding_vsi'
            securable_type: 'TABLE'
            permission: 'SELECT'

        # Embedding model endpoint for vector search queries
        - name: 'embedding_endpoint'
          serving_endpoint:
            name: 'databricks-bge-large-en'
            permission: 'CAN_QUERY'

        # Vector search endpoint
        - name: 'sec_endpoint'
          serving_endpoint:
            name: 'sec_endpoint'
            permission: 'CAN_QUERY'

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
    resources:
      apps:
        agent_openai_agents_sdk_multiagent:
          name: agent-sec-extraction
