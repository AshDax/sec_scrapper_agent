bundle:
  name: agent_openai_agents_sdk_multiagent

resources:
  apps:
    agent_openai_agents_sdk_multiagent:
      name: "agent-sec-extraction"
      description: "SEC Filing Information Extraction Agent — extracts structured business attributes from SEC filings"
      source_code_path: ./
      config:
        command: ["uv", "run", "start-app"]
        env:
          - name: MLFLOW_TRACKING_URI
            value: "databricks"
          - name: MLFLOW_REGISTRY_URI
            value: "databricks-uc"
          - name: API_PROXY
            value: "http://localhost:8000/invocations"
          - name: CHAT_APP_PORT
            value: "3000"
          - name: CHAT_PROXY_TIMEOUT_SECONDS
            value: "300"
          - name: MLFLOW_EXPERIMENT_ID
            value_from: "experiment"

      resources:
        - name: 'experiment'
          experiment:
            experiment_id: "2932940041946641"
            permission: 'CAN_MANAGE'

        # NOTE: Vector search index, embedding endpoint, and search endpoint
        # permissions are managed at the workspace level for the hackathon.
        # If you get permission errors at runtime, manually grant the app's
        # service principal access to these resources.

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-7c699d6a-b2cd.cloud.databricks.com
      profile: hackathon_ws

  prod:
    mode: production
    workspace:
      host: https://dbc-7c699d6a-b2cd.cloud.databricks.com
      profile: hackathon_ws
    resources:
      apps:
        agent_openai_agents_sdk_multiagent:
          name: agent-sec-extraction
